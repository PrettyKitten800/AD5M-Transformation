# Flashforge AD5M / Raspberry Pi 5 host
[server]
# Access through nginx on port 80; do not expose the API port directly.
host: 127.0.0.1
port: 7125
klippy_uds_address: /home/curby/printer_data/comms/klippy.sock

[machine]
provider: systemd_dbus

[authorization]
# Only loopback and the currently connected local LAN are trusted initially.
# Create a user in Mainsail: force_logins then requires authentication.
trusted_clients:
    127.0.0.1
    ::1
    192.168.4.0/22
force_logins: True
cors_domains:
    http://curberrypi.local
    http://192.168.4.43
    http://192.168.4.42

[file_manager]
enable_object_processing: True

[history]

[octoprint_compat]

[update_manager]
refresh_interval: 168

[update_manager mainsail]
type: web
channel: stable
repo: mainsail-crew/mainsail
path: /var/www/mainsail
persistent_files:
    config.json

[update_manager mainsail-config]
type: git_repo
primary_branch: master
path: /home/curby/mainsail-config
origin: https://github.com/mainsail-crew/mainsail-config.git
managed_services: klipper

[update_manager KlipperScreen]
type: git_repo
path: /home/curby/KlipperScreen
origin: https://github.com/KlipperScreen/KlipperScreen.git
virtualenv: /home/curby/.KlipperScreen-env
requirements: scripts/KlipperScreen-requirements.txt
system_dependencies: scripts/system-dependencies.json
# Desktop application: no managed system service to restart.
