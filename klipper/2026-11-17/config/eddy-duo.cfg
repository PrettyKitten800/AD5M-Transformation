# Eddy Duo remounted Nov 11 (board rotated 180 deg, long end toward nozzle): coil center 35 mm right of nozzle, Y aligned.
# Installed Klipper v0.13.0-820 uses Eddy calibration data directly;
# do not copy the older BTT z_offset field into this version.
[mcu eddy]
canbus_uuid: 632e1e4d52f7
canbus_interface: can0

[temperature_sensor Eddy_MCU]
sensor_type: temperature_mcu
sensor_mcu: eddy
min_temp: 0
max_temp: 100

[probe_eddy_current btt_eddy]
sensor_type: ldc1612
descend_z: 0.5
i2c_mcu: eddy
i2c_bus: i2c0f
x_offset: 35
y_offset: 0
speed: 2
lift_speed: 5
samples: 1

[temperature_probe btt_eddy]
sensor_type: Generic 3950
sensor_pin: eddy:gpio26
min_temp: 0
max_temp: 100
horizontal_move_z: 3

# Temperature-drift calibration workflow; physical paper references required.
calibration_position: 135, 110, 1
calibration_extruder_temp: 260
calibration_bed_temp: 75
extruder_heating_z: 30
resting_z: 0.5
speed: 40
