# AD5M rebuild — BTT HDMI5 connected to the Raspberry Pi 5.
# Installed as a desktop app; no standalone service or autostart is enabled.
[main]
default_printer: AD5M

[printer AD5M]
moonraker_host: 127.0.0.1
moonraker_port: 7125
# Once Moonraker force_logins is active, add its API key locally here:
# moonraker_api_key: YOUR_MOONRAKER_API_KEY
extrude_speeds: 1, 2, 5, 10
