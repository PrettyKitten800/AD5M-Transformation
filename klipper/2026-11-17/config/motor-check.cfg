# Individual motor checks with provisional 0.5 A RMS current.
# Confirmed sockets: X DRIVER7, Y DRIVER6, Z DRIVER5 (nearest USB first).

[manual_stepper motor_z]
step_pin: PC13
dir_pin: PF0
enable_pin: !PF1
microsteps: 16
rotation_distance: 7.98
velocity: 2
accel: 20
position_min: -2
position_max: 2

[tmc2209 manual_stepper motor_z]
uart_pin: PE4
run_current: 0.500
stealthchop_threshold: 0

[manual_stepper motor_y]
step_pin: PE2
dir_pin: PE3
enable_pin: !PD4
microsteps: 16
rotation_distance: 39.9
velocity: 2
accel: 20
position_min: -2
position_max: 2

[tmc2209 manual_stepper motor_y]
uart_pin: PE1
run_current: 0.500
stealthchop_threshold: 0

[manual_stepper motor_x]
step_pin: PE6
dir_pin: PA14
enable_pin: !PE0
microsteps: 16
rotation_distance: 39.9
velocity: 2
accel: 20
position_min: -2
position_max: 2

[tmc2209 manual_stepper motor_x]
uart_pin: PD3
run_current: 0.500
stealthchop_threshold: 0

[manual_stepper motor_extruder]
step_pin: head:PD0
dir_pin: !head:PD1
enable_pin: !head:PD2
microsteps: 16
rotation_distance: 4.4
velocity: 2
accel: 20
position_min: -2
position_max: 2

[tmc2209 manual_stepper motor_extruder]
uart_pin: head:PA15
run_current: 0.500
stealthchop_threshold: 0
