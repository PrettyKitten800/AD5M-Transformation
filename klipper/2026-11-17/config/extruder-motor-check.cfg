# Keep the extruder in individual motor checkout until thermal commissioning.

[manual_stepper motor_extruder]
step_pin: head:PD0
dir_pin: !head:PD1
enable_pin: !head:PD2
microsteps: 16
rotation_distance: 4.4
velocity: 2
accel: 20
position_min: -2
position_max: 2

[tmc2209 manual_stepper motor_extruder]
uart_pin: head:PA15
run_current: 0.500
stealthchop_threshold: 0
