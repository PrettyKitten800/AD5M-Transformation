# Eddy Duo on CAN using eddy-ng (Kalico plugin + firmware extra).
# Coil center is 28.7 mm right of the nozzle, Y aligned.
[mcu eddy]
canbus_uuid: 632e1e4d52f7
canbus_interface: can0

[temperature_sensor Eddy_MCU]
sensor_type: temperature_mcu
sensor_mcu: eddy
min_temp: 0
max_temp: 100

[temperature_sensor btt_eddy]
sensor_type: Generic 3950
sensor_pin: eddy:gpio26
min_temp: 0
max_temp: 100

[probe_eddy_ng btt_eddy]
sensor_type: btt_eddy
i2c_mcu: eddy
i2c_bus: i2c0f
x_offset: 28.7
y_offset: 0
tap_start_z: 1.6
tap_target_z: -0.200
