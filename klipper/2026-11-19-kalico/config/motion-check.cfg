# CoreXY commissioning with Z-max verified and XY stall thresholds pending.

[stepper_x]
step_pin: PE6
dir_pin: PA14
enable_pin: !PE0
microsteps: 16
rotation_distance: 39.9
endstop_pin: tmc2209_stepper_x:virtual_endstop
position_endstop: 219.7
# Homed at the right stop (X219.7); -3.7 min leaves 1.013 mm clearance at the left stop (+6.3 mm nozzle shift 2026-11-18).
position_max: 219.7
position_min: -3.7
homing_positive_dir: True
homing_speed: 20
homing_accel: 500
homing_retract_dist: 5
min_home_dist: 5

[tmc2209 stepper_x]
uart_pin: PD3
diag_pin: ^PG15
# Confirmed clean X homing at the right-side (X-max) stop.
driver_SGTHRS: 64
# Provisional RMS current; verify stock motor and driver cooling.
run_current: 0.800
home_current: 0.600
current_change_dwell_time: 0.5
sense_resistor: 0.110
interpolate: True
stealthchop_threshold: 0

[stepper_y]
step_pin: PE2
dir_pin: PE3
enable_pin: !PD4
microsteps: 16
rotation_distance: 39.9
endstop_pin: tmc2209_stepper_y:virtual_endstop
position_endstop: 220
position_max: 220
# Front clearance measured by user with new toolhead/fan shroud installed, 2026-11-18.
position_min: 5
homing_positive_dir: True
homing_speed: 20
homing_accel: 500
homing_retract_dist: 5
min_home_dist: 5

[tmc2209 stepper_y]
uart_pin: PE1
diag_pin: ^PG14
# Restore previously working Y threshold; 80 may false-trigger before the rear stop.
driver_SGTHRS: 64
run_current: 0.800
home_current: 0.600
current_change_dwell_time: 0.5
sense_resistor: 0.110
interpolate: True
stealthchop_threshold: 0

[stepper_z]
step_pin: PC13
dir_pin: PF0
enable_pin: !PF1
microsteps: 16
rotation_distance: 7.98
# Stock lower Z optical endstop verified on STOP2: clear is released, blocked is pressed.
endstop_pin: ^PG10
# Cold paper calibration. SAVE_CONFIG manages position_endstop in printer.cfg.
position_max: 206.7
# Allow 0.2 mm below Z0 for eddy-ng tap and bed thermal/mesh variation.
position_min: -0.2
homing_positive_dir: True
homing_speed: 10
homing_retract_dist: 5
homing_retract_speed: 10
second_homing_speed: 2

[tmc2209 stepper_z]
uart_pin: PE4
run_current: 0.500
sense_resistor: 0.110
interpolate: True
stealthchop_threshold: 0

[homing_override]
axes: xyz
gcode:
    {% set home_all = "X" not in params and "Y" not in params and "Z" not in params %}
    {% set home_x = home_all or "X" in params %}
    {% set home_y = home_all or "Y" in params or home_x %}
    {% set home_z = home_all or "Z" in params %}
    {% if (home_x or home_y) and not home_z and "z" not in printer.toolhead.homed_axes %}
        {action_raise_error("Home Z before testing X or Y")}
    {% endif %}
    # Home the lower Z switch without an active mesh transform.
    BED_MESH_CLEAR
    {% if home_z %}
        {% if "z" in printer.toolhead.homed_axes %}
            {% set z_stop = 200.0 %}
            {% if printer.toolhead.position.z < z_stop %}
                _Z_ZONE_MOVE Z={z_stop}
            {% endif %}
        {% endif %}
        G28 Z
    {% endif %}
    # Always establish rear Y clearance before X homing, even for G28 X.
    # Homing X while the carriage is forward can drive Eddy into the frame.
    {% if home_y %}
        G28 Y
    {% endif %}
    {% if home_x %}
        G28 X
    {% endif %}

[gcode_macro _Z_ZONE_MOVE]
description: Move Z with 0-5 / 200-Zmax slow (10 mm/s), 5-10 / 195-200 smooth ramp (80 mm/s^2), and 10-195 fast (30 mm/s)
gcode:
    {% if "z" not in printer.toolhead.homed_axes %}
        {action_raise_error("_Z_ZONE_MOVE requires homed Z")}
    {% endif %}
    {% set target = params.Z | float %}
    {% set slow = params.SLOW | default(10.0) | float %}
    {% set fast = params.FAST | default(30.0) | float %}
    {% set z0 = params.Z0 | default(5.0) | float %}
    {% set z1 = params.Z1 | default(10.0) | float %}
    {% set z2 = params.Z2 | default(195.0) | float %}
    {% set z3 = params.Z3 | default(200.0) | float %}
    {% set orig_z_accel = printer.configfile.settings.printer.max_z_accel | float %}
    {% set ramp_low = [((fast * fast) - (slow * slow)) / (2.0 * (z1 - z0)), orig_z_accel] | min %}
    {% set ramp_high = [((fast * fast) - (slow * slow)) / (2.0 * (z3 - z2)), orig_z_accel] | min %}
    {% set ns = namespace(cur=printer.toolhead.position.z | float) %}
    SAVE_GCODE_STATE NAME=z_zone_move
    G90
    {% if target > ns.cur %}
        {% if ns.cur < z0 %}
            {% set next_z = [target, z0] | min %}
            SET_KINEMATICS_LIMIT Z_ACCEL={orig_z_accel}
            G1 Z{next_z} F{slow * 60}
            {% set ns.cur = next_z %}
        {% endif %}
        {% if ns.cur < z1 and target > ns.cur %}
            {% set next_z = [target, z1] | min %}
            SET_KINEMATICS_LIMIT Z_ACCEL={ramp_low}
            G1 Z{next_z} F{fast * 60}
            {% set ns.cur = next_z %}
        {% endif %}
        {% if ns.cur < z2 and target > ns.cur %}
            {% set next_z = [target, z2] | min %}
            SET_KINEMATICS_LIMIT Z_ACCEL={orig_z_accel}
            G1 Z{next_z} F{fast * 60}
            {% set ns.cur = next_z %}
        {% endif %}
        {% if ns.cur < z3 and target > ns.cur %}
            {% set next_z = [target, z3] | min %}
            SET_KINEMATICS_LIMIT Z_ACCEL={ramp_high}
            G1 Z{next_z} F{fast * 60}
            {% set ns.cur = next_z %}
        {% endif %}
        {% if target > ns.cur %}
            SET_KINEMATICS_LIMIT Z_ACCEL={orig_z_accel}
            G1 Z{target} F{slow * 60}
        {% endif %}
    {% elif target < ns.cur %}
        {% if ns.cur > z3 %}
            {% set next_z = [target, z3] | max %}
            SET_KINEMATICS_LIMIT Z_ACCEL={orig_z_accel}
            G1 Z{next_z} F{slow * 60}
            {% set ns.cur = next_z %}
        {% endif %}
        {% if ns.cur > z2 and target < ns.cur %}
            {% set next_z = [target, z2] | max %}
            SET_KINEMATICS_LIMIT Z_ACCEL={ramp_high}
            G1 Z{next_z} F{fast * 60}
            {% set ns.cur = next_z %}
        {% endif %}
        {% if ns.cur > z1 and target < ns.cur %}
            {% set next_z = [target, z1] | max %}
            SET_KINEMATICS_LIMIT Z_ACCEL={orig_z_accel}
            G1 Z{next_z} F{fast * 60}
            {% set ns.cur = next_z %}
        {% endif %}
        {% if ns.cur > z0 and target < ns.cur %}
            {% set next_z = [target, z0] | max %}
            SET_KINEMATICS_LIMIT Z_ACCEL={ramp_low}
            G1 Z{next_z} F{fast * 60}
            {% set ns.cur = next_z %}
        {% endif %}
        {% if target < ns.cur %}
            SET_KINEMATICS_LIMIT Z_ACCEL={orig_z_accel}
            G1 Z{target} F{slow * 60}
        {% endif %}
    {% endif %}
    SET_KINEMATICS_LIMIT Z_ACCEL={orig_z_accel}
    RESTORE_GCODE_STATE NAME=z_zone_move

