# Helper macros for eddy-ng (probe_eddy_ng btt_eddy) on Kalico.
# Heater-using macros must only be run while the printer is supervised.

[gcode_macro EDDY_STATUS]
description: Read-only eddy-ng sensor status and calibration check
gcode:
    PROBE_EDDY_NG_STATUS

[gcode_macro EDDY_TAP]
description: Home if needed, move to bed center (X110 Y110), and run PROBE_EDDY_NG_TAP
gcode:
    {% if printer.print_stats.state in ["printing", "paused"] %}
        {action_raise_error("Run EDDY_TAP with the printer idle")}
    {% endif %}
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28
    {% endif %}
    _Z_ZONE_MOVE Z=10
    G90
    G1 X110 Y110 F3000
    PROBE_EDDY_NG_TAP

[gcode_macro EDDY_MESH]
description: Heat bed (BED_TEMP, default 60), tap at safe nozzle temp (150 C), and rapid-scan full mesh (PROFILE)
gcode:
    {% set bed_temp = params.BED_TEMP | default(60) | float(-1) %}
    {% set profile = params.PROFILE | default("eddy_%d" % (bed_temp,)) %}
    {% set cfg = printer.configfile.settings %}
    {% if printer.print_stats.state in ["printing", "paused"] %}
        {action_raise_error("Run Eddy mesh with the printer idle")}
    {% endif %}
    {% if not 0 <= bed_temp < cfg.heater_bed.max_temp %}
        {action_raise_error("BED_TEMP is outside heater limits")}
    {% endif %}
    {% if not profile.replace("_", "").replace("-", "").isalnum() %}
        {action_raise_error("PROFILE must contain only letters, digits, underscores or hyphens")}
    {% endif %}
    BED_MESH_CLEAR
    PROBE_EDDY_NG_SET_TAP_OFFSET VALUE=0
    M140 S{bed_temp}
    M104 S150
    G28
    _Z_ZONE_MOVE Z=10
    G90
    G1 X110 Y110 F3000
    {% if bed_temp > 0 %}
        M190 S{bed_temp}
    {% endif %}
    M104 S150
    TEMPERATURE_WAIT SENSOR=extruder MINIMUM=148 MAXIMUM=155
    PROBE_EDDY_NG_TAP
    BED_MESH_CALIBRATE PROFILE={profile} METHOD=rapid_scan
    M104 S0
    M140 S0
    G1 Z10 F600
    RESPOND MSG="Mesh '{profile}' built. Run SAVE_CONFIG to keep it (restarts Kalico)."
