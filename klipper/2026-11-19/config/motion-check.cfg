# CoreXY commissioning with Z-max verified and XY stall thresholds pending.

[stepper_x]
step_pin: PE6
dir_pin: PA14
enable_pin: !PE0
microsteps: 16
rotation_distance: 39.9
endstop_pin: tmc2209_stepper_x:virtual_endstop
position_endstop: 219.7
# Homed at the right stop (X219.7); -3.7 min leaves 1.013 mm clearance at the left stop (+6.3 mm nozzle shift 2026-11-18).
position_max: 219.7
position_min: -3.7
homing_positive_dir: True
homing_speed: 20
homing_retract_dist: 0

[tmc2209 stepper_x]
uart_pin: PD3
diag_pin: ^PG15
# Confirmed clean X homing at the right-side (X-max) stop.
driver_SGTHRS: 64
# Provisional RMS current; verify stock motor and driver cooling.
run_current: 0.800
interpolate: True
stealthchop_threshold: 0

[stepper_y]
step_pin: PE2
dir_pin: PE3
enable_pin: !PD4
microsteps: 16
rotation_distance: 39.9
endstop_pin: tmc2209_stepper_y:virtual_endstop
position_endstop: 220
position_max: 220
# Front clearance measured by user with new toolhead/fan shroud installed, 2026-11-18.
position_min: 5
homing_positive_dir: True
homing_speed: 20
homing_retract_dist: 0

[tmc2209 stepper_y]
uart_pin: PE1
diag_pin: ^PG14
# Restore previously working Y threshold; 80 may false-trigger before the rear stop.
driver_SGTHRS: 64
run_current: 0.800
interpolate: True
stealthchop_threshold: 0

[stepper_z]
step_pin: PC13
dir_pin: PF0
enable_pin: !PF1
microsteps: 16
rotation_distance: 7.98
# Stock lower Z optical endstop verified on STOP2: clear is released, blocked is pressed.
endstop_pin: ^PG10
# Cold paper calibration. SAVE_CONFIG manages position_endstop in printer.cfg.
position_max: 206.353
# Allow 0.4 mm below paper-test Z0 for probe calibration and bed thermal/mesh variation.
position_min: -0.4
homing_positive_dir: True
homing_speed: 10
homing_retract_dist: 5
homing_retract_speed: 10
second_homing_speed: 2

[tmc2209 stepper_z]
uart_pin: PE4
run_current: 0.500
interpolate: True
stealthchop_threshold: 0

[homing_override]
axes: xyz
gcode:
    {% set home_all = "X" not in params and "Y" not in params and "Z" not in params %}
    {% set home_x = home_all or "X" in params %}
    {% set home_y = home_all or "Y" in params or home_x %}
    {% set home_z = home_all or "Z" in params %}
    {% set tuned = printer["gcode_macro _SENSORLESS_BACKOFF"].tuned %}
    {% if home_x and not tuned %}
        {action_raise_error("X homing requires calibrated rear Y homing and backoff")}
    {% endif %}
    {% if (home_x or home_y) and not home_z and "z" not in printer.toolhead.homed_axes %}
        {action_raise_error("Home Z before testing X or Y")}
    {% endif %}
    {% set restore_accel = printer.toolhead.max_accel %}
    SET_VELOCITY_LIMIT ACCEL=500
    # Home the lower Z switch without an active mesh transform.
    BED_MESH_CLEAR
    {% if home_z %}
        G28 Z
    {% endif %}
    # Always establish rear Y clearance before X homing, even for G28 X.
    # Homing X while the carriage is forward can drive Eddy into the frame.
    {% if home_y %}
        G4 P2000
        G28 Y
        {% if tuned %}
            _SENSORLESS_BACKOFF AXIS=Y
        {% endif %}
    {% endif %}
    {% if home_x %}
        G4 P2000
        G28 X
        {% if tuned %}
            _SENSORLESS_BACKOFF AXIS=X
        {% endif %}
    {% endif %}
    SET_VELOCITY_LIMIT ACCEL={restore_accel}

[gcode_macro _SENSORLESS_BACKOFF]
# Back off away from each configured stop: X-max negative, Y-max negative.
# Both contacts and approximately 1 mm clearance at the right limit verified.
variable_tuned: True
gcode:
    {% set axis = params.AXIS | upper %}
    {% if axis not in ["X", "Y"] %}
        {action_raise_error("Backoff requires X or Y")}
    {% endif %}
    {% set positive = printer.configfile.settings["stepper_" ~ (axis | lower)].homing_positive_dir %}
    SAVE_GCODE_STATE NAME=sensorless_backoff
    G91
    G1 {axis}{(-5 if positive else 5)} F1200
    M400
    RESTORE_GCODE_STATE NAME=sensorless_backoff

