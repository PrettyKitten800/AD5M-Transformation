# Orbiter v2.5 with the standard LDO motor on EBB42 CAN v1.2.1.
# Baseline from Orbiter Projects. Calibrate filament travel and pressure advance on this printer.
[extruder]
step_pin: head:PD0
dir_pin: head:PD1
enable_pin: !head:PD2
microsteps: 32
full_steps_per_rotation: 200
rotation_distance: 4.69
pressure_advance: 0.025
pressure_advance_smooth_time: 0.030
# User confirmed newly installed 0.4 mm nozzle, 2026-11-16.
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: head:PB13
sensor_pin: head:PA3
# Same Generic 3950 curve used during the verified temperature checkout.
sensor_type: Generic 3950
pullup_resistor: 4700
# control, pid_Kp, pid_Ki, and pid_Kd are managed in printer.cfg via SAVE_CONFIG.
max_power: 1.0
min_temp: 0
max_temp: 335
min_extrude_temp: 170
max_extrude_only_distance: 500
max_extrude_only_velocity: 120
max_extrude_only_accel: 3000

[tmc2209 extruder]
uart_pin: head:PA15
run_current: 0.85
sense_resistor: 0.110
interpolate: False
stealthchop_threshold: 0
driver_TBL: 0
driver_HEND: 6
driver_HSTRT: 7
driver_TOFF: 4

[heater_fan hotend_fan]
pin: head:PA1
heater: extruder
heater_temp: 40
fan_speed: 1.0
