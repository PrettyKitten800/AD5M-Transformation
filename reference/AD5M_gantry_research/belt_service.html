<style type="text/css">.responsive-embed{position:relative;padding-bottom:56.2%;height:0;margin:10px 0;overflow:hidden}.responsive-embed iframe{position:absolute;top:0;left:0;width:720px;height:480px;border-radius:15px}</style><script type="text/javascript" defer>
  // 修复后的正则表达式 - 优化以正确处理 youtu.be 短链接和查询参数
  const rxYoutube = /^(?:https?:\/\/)?(?:www\.|m\.)?(?:youtube\.com\/(?:watch\?v=|embed\/|v\/|shorts\/)|youtu\.be\/)([\w\-]+)(?:[?&#].*)?$/
  
  const rxScreencast = /^(?:https?:\/\/)?(?:www\.)?(screencast\.com)(\/users)\/([a-z0-9_-]+)\/folders\/([a-z0-9%_-]+)\/media\/([a-z0-9_-]+)(?:\/)?$/im
  
  const rxFlashforge = /^(?:https?:\/\/)?(?:www\.|m\.)?(flashforge\.com)/

  window.boot.register('vue', () => {
    const processedElements = new WeakSet()
    
    // 提取视频 ID 和 si 参数
    const extractVideoInfo = (url) => {
      const ytMatch = url.match(rxYoutube)
      if (!ytMatch || !ytMatch[1]) return null
      
      const cleanVideoId = ytMatch[1].split('?')[0].split('&')[0].split('#')[0]
      const siMatch = url.match(/[?&]si=([^&]+)/)
      const siParam = siMatch && siMatch[1] ? `?si=${siMatch[1]}` : ''
      
      return {
        videoId: cleanVideoId,
        siParam: siParam,
        embedUrl: `https://www.youtube.com/embed/${cleanVideoId}${siParam}`,
        embedUrlNocookie: `https://www.youtube-nocookie.com/embed/${cleanVideoId}${siParam}`,
        watchUrl: `https://www.youtube.com/watch?v=${cleanVideoId}`
      }
    }
    
    // 创建 YouTube 视频嵌入
    const createYouTubeEmbed = (info) => {
      const container = document.createElement('div')
      container.classList.add('responsive-embed')
      container.style.cssText = 'position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; width: 100%; margin: 20px 0;'
      
      // 创建 iframe
      const iframe = document.createElement('iframe')
      iframe.setAttribute('width', '560')
      iframe.setAttribute('height', '315')
      iframe.setAttribute('src', info.embedUrl)
      iframe.setAttribute('title', 'YouTube video player')
      iframe.setAttribute('frameborder', '0')
      iframe.setAttribute('allow', 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share')
      iframe.setAttribute('referrerpolicy', 'strict-origin-when-cross-origin')
      iframe.setAttribute('allowfullscreen', '')
      iframe.style.cssText = 'position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none;'
      
      // 创建备用按钮
      const fallback = document.createElement('a')
      fallback.href = info.watchUrl
      fallback.target = '_blank'
      fallback.rel = 'noopener noreferrer'
      fallback.className = 'youtube-fallback'
      fallback.style.cssText = 'display: none; flex-direction: column; align-items: center; justify-content: center; position: absolute; top: 0; left: 0; width: 100%; height: 100%; text-decoration: none; color: white; cursor: pointer; background: #000;'
      
      const playIcon = document.createElement('div')
      playIcon.style.cssText = 'width: 80px; height: 80px; background: rgba(255, 0, 0, 0.9); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin-bottom: 20px; transition: all 0.3s ease;'
      playIcon.innerHTML = '<svg width="40" height="40" viewBox="0 0 24 24" fill="white"><path d="M8 5v14l11-7z"/></svg>'
      
      const text = document.createElement('div')
      text.style.cssText = 'font-size: 18px; font-weight: bold; text-align: center;'
      text.textContent = '在 YouTube 上观看此视频'
      
      fallback.addEventListener('mouseenter', () => {
        playIcon.style.transform = 'scale(1.1)'
        playIcon.style.background = 'rgba(255, 0, 0, 1)'
      })
      fallback.addEventListener('mouseleave', () => {
        playIcon.style.transform = 'scale(1)'
        playIcon.style.background = 'rgba(255, 0, 0, 0.9)'
      })
      
      fallback.appendChild(playIcon)
      fallback.appendChild(text)
      
      // 错误处理
      const checkAndFallback = () => {
        setTimeout(() => {
          if (iframe.getBoundingClientRect().height < 100) {
            iframe.src = info.embedUrlNocookie
            setTimeout(() => {
              if (iframe.getBoundingClientRect().height < 100) {
                iframe.style.display = 'none'
                fallback.style.display = 'flex'
              }
            }, 3000)
          }
        }, 3000)
      }
      
      iframe.addEventListener('error', () => { iframe.src = info.embedUrlNocookie })
      checkAndFallback()
      
      container.appendChild(iframe)
      container.appendChild(fallback)
      return container
    }
    
    // 处理单个元素
    const processElement = (elm) => {
      if (processedElements.has(elm) || elm.closest('.responsive-embed')) return
      
      const url = elm.getAttribute('url') || elm.getAttribute('href')
      if (!url) return
      
      const videoInfo = extractVideoInfo(url)
      if (videoInfo) {
        const newElm = createYouTubeEmbed(videoInfo)
        processedElements.add(elm)
        try {
          elm.replaceWith(newElm)
        } catch (e) {
          if (elm.parentNode) elm.parentNode.replaceChild(newElm, elm)
        }
        return
      }
      
      // 处理其他类型的视频
      const scMatch = url.match(rxScreencast)
      const flashforgeMatch = url.match(rxFlashforge)
      
      if (scMatch) {
        const newElm = document.createElement('div')
        newElm.classList.add('responsive-embed')
        newElm.style.cssText = 'position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; width: 100%; margin: 20px 0;'
        newElm.innerHTML = `<iframe width="100%" height="100%" src="${url}/embed" frameborder="0" allowfullscreen style="position: absolute; top: 0; left: 0;"></iframe>`
        processedElements.add(elm)
        try {
          elm.replaceWith(newElm)
        } catch (e) {
          if (elm.parentNode) elm.parentNode.replaceChild(newElm, elm)
        }
      } else if (url.endsWith('.mp4')) {
        const newElm = document.createElement('div')
        newElm.innerHTML = `<video controls width="640" height="360"><source src="${url}" type="video/mp4"></video>`
        processedElements.add(elm)
        try {
          elm.replaceWith(newElm)
        } catch (e) {
          if (elm.parentNode) elm.parentNode.replaceChild(newElm, elm)
        }
      } else if (flashforgeMatch) {
        // 跳过 flashforge.com（CSP 限制）
        processedElements.add(elm)
      }
    }
    
    // 主处理函数
    const processVideoEmbeds = () => {
      document.querySelectorAll('a[href], oembed[url]').forEach(processElement)
    }
    
    // 执行和监听
    processVideoEmbeds()
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', processVideoEmbeds)
    }
    window.onload = processVideoEmbeds
    
    const observer = new MutationObserver(processVideoEmbeds)
    observer.observe(document.body || document.documentElement, {
      childList: true,
      subtree: true
    })
    
    setTimeout(processVideoEmbeds, 1000)
    setTimeout(processVideoEmbeds, 2000)
  })
</script>
