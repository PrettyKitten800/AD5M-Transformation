<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fan shroud review</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#18202a;color:#eff4f5;font:16px/1.4 "Segoe UI",sans-serif}main{height:100dvh;display:flex;flex-direction:column}header,footer{padding:12px 18px;background:#202b38}header{display:flex;align-items:center;flex-wrap:wrap;gap:9px}h1{font-size:20px;margin:0 auto 0 0}button,select,input{font:inherit;color:inherit;background:#2e3d4c;border:1px solid #697a87;border-radius:6px;padding:6px 11px}button{cursor:pointer}button[aria-pressed=true]{color:#123336;background:#8ce1dc;border-color:#8ce1dc}#viewport{position:relative;flex:1;min-height:180px;overflow:hidden}canvas{display:block;width:100%;height:100%;touch-action:none}#pins{position:absolute;inset:0;pointer-events:none}.tag{position:absolute;transform:translate(4px,-100%);padding:1px 5px;border-radius:4px;background:#ffe2a6;color:#38280f;font-size:13px;font-weight:700}footer{display:grid;gap:8px}.row{display:flex;flex-wrap:wrap;align-items:center;gap:8px}input{flex:1;min-width:140px}p{margin:0;color:#b8c8d3;font-size:14px}#status{margin-left:auto}
</style><script type="importmap">{"imports":{"three":"/three.js"}}</script></head>
<body><main><header><h1>Fan shroud</h1><button id="rotate" aria-pressed="true">Rotate</button><button id="pin" aria-pressed="false">Place pin</button><button id="draw" aria-pressed="false">Draw</button><button id="reset">Reset view</button></header>
<div id="viewport"><canvas aria-label="Interactive recovered fan shroud"></canvas><div id="pins"></div></div>
<footer><p id="hint">Drag to rotate. Scroll or pinch to zoom.</p><div class="row"><select id="marks" aria-label="Selected mark" disabled><option>No marks yet</option></select><input id="note" aria-label="Annotation" placeholder="Describe the change at this mark" disabled><button id="remove" disabled>Delete mark</button></div><p id="status" role="status">Loading shroud…</p></footer></main>
<script type="module" src="/app.js"></script></body></html>
